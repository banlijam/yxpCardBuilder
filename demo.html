<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>物理音游 Demo v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; }
  #app { display: flex; width: 100vw; height: 100vh; }
  #sidebar {
    width: 200px; min-width: 200px; background: #16213e;
    border-right: 2px solid #0f3460; padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  #sidebar h3 { font-size: 13px; color: #e94560; letter-spacing: 2px; text-align: center; }
  .instrument {
    background: #0f3460; border: 2px dashed #533483; border-radius: 10px;
    padding: 10px; text-align: center; cursor: grab; user-select: none;
    transition: transform .1s, border-color .1s;
  }
  .instrument:hover { border-color: #e94560; transform: translateY(-2px); }
  .instrument:active { cursor: grabbing; }
  .instrument .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .instrument .name { font-size: 13px; font-weight: bold; }
  .instrument .info { font-size: 10px; opacity: .6; margin-top: 3px; }
  #stage-wrap { flex: 1; position: relative; background: #0f0f1e; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: absolute; bottom: 10px; right: 12px; display: flex; gap: 8px;
  }
  #controls button {
    background: #e94560; border: none; color: white; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  #controls button:hover { background: #ff6b81; }
  #legend {
    position: absolute; top: 10px; left: 10px; font-size: 11px;
    background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 6px; line-height: 1.6;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h3>乐器库</h3>
    <div class="instrument" draggable="true" data-type="triangle" data-freq="1320">
      <span class="icon">🔺</span>
      <div class="name">三角铁</div>
      <div class="info">高音 C6</div>
    </div>
    <div class="instrument" draggable="true" data-type="woodfish" data-freq="440">
      <span class="icon">🪵</span>
      <div class="name">木鱼</div>
      <div class="info">中音 A4</div>
    </div>
  </div>
  <div id="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="legend">
      📐 椭圆 a=5 b=4 c=3<br>
      🔴 焦点 F1 (9,8) · F2 (15,8)<br>
      ⏱ 每秒发射 · 最多反弹2次<br>
      ✨ 放焦点上 → 完美椭圆反射<br>
      🖱 拖入舞台 · 右键移除
    </div>
    <div id="controls">
      <button id="clearBtn">清空</button>
    </div>
  </div>
</div>

<script>
// ========== 常量 ==========
const GRID   = 32;   // 每格像素（更大）
const CW     = 24;   // 舞台宽（格）
const CH     = 16;   // 舞台高（格）

// 椭圆参数：a=5, b=4 → c = √(25-16) = 3 ✅ 完美整数
const A = 5;
const B = 4;
const C = 3;
const TWO_A = 2 * A;   // = 10
const FOUR_A = 4 * A;  // = 20

// 舞台中心（整数格点）
const CX = CW / 2;     // 12
const CY = CH / 2;     // 8

// 焦点（整数格点 ✅）
const F1 = { x: CX - C, y: CY };   // (9, 8)
const F2 = { x: CX + C, y: CY };   // (15, 8)

// 舞台边界线：过 F1 右移 1 格
const BOUNDARY_X = F1.x + 1; // 10

// ========== 画布 ==========
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function resize() {
  const wrap = document.getElementById('stage-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ========== 坐标变换 ==========
function g2px(gx, gy) {
  const offX = (canvas.width  - CW * GRID) / 2;
  const offY = (canvas.height - CH * GRID) / 2;
  return { x: offX + gx * GRID, y: offY + gy * GRID };
}
function px2g(px, py) {
  const offX = (canvas.width  - CW * GRID) / 2;
  const offY = (canvas.height - CH * GRID) / 2;
  return { x: (px - offX) / GRID, y: (py - offY) / GRID };
}

// ========== 椭圆判定 ==========
function insideEllipse(x, y) {
  const dx = (x - CX) / A;
  const dy = (y - CY) / B;
  return dx * dx + dy * dy <= 1;
}
function insideStage(x, y) {
  return insideEllipse(x, y) && x >= BOUNDARY_X - 0.5;
}
// 射线 (ox,oy) + t*(dx,dy) 到椭圆的最近正交点 t
function rayEllipseT(ox, oy, dx, dy) {
  const p = (ox - CX) / A, q = (oy - CY) / B;
  const u = dx / A, v = dy / B;
  const aa = u * u + v * v;
  const bb = 2 * (p * u + q * v);
  const cc = p * p + q * q - 1;
  const disc = bb * bb - 4 * aa * cc;
  if (disc < 0) return null;
  const s = Math.sqrt(disc);
  const t1 = (-bb - s) / (2 * aa);
  const t2 = (-bb + s) / (2 * aa);
  if (t1 > 1e-6) return t1;
  if (t2 > 1e-6) return t2;
  return null;
}

// ========== 频率→颜色 ==========
function freqToColor(freq) {
  const t = Math.min(1, Math.max(0, Math.log2(freq / 200) / 3.32));
  const hue = (1 - t) * 0 + t * 280;
  return `hsl(${hue}, 90%, 60%)`;
}

// ========== 数据 ==========
/** @type {{gx:number,gy:number,type:string,freq:number}[]} */
const instruments = [];
/** @type {{sx:number,sy:number,r:number,freq:number,color:string,dead:boolean}[]} */
const waves = [];

// ========== 拖拽 ==========
let dragInfo = null;
document.querySelectorAll('.instrument').forEach(el => {
  el.addEventListener('dragstart', e => {
    dragInfo = {
      type: el.dataset.type,
      freq: parseFloat(el.dataset.freq),
    };
    e.dataTransfer.effectAllowed = 'copy';
  });
});
const stageWrap = document.getElementById('stage-wrap');
stageWrap.addEventListener('dragover', e => e.preventDefault());
stageWrap.addEventListener('drop', e => {
  e.preventDefault();
  if (!dragInfo) return;
  const rect = canvas.getBoundingClientRect();
  const g = px2g(e.clientX - rect.left, e.clientY - rect.top);
  const gx = Math.round(g.x);
  const gy = Math.round(g.y);
  if (insideStage(gx, gy)) {
    const idx = instruments.findIndex(i => i.gx === gx && i.gy === gy);
    if (idx >= 0) instruments.splice(idx, 1);
    instruments.push({ gx, gy, ...dragInfo });
  }
  dragInfo = null;
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const g = px2g(e.clientX - rect.left, e.clientY - rect.top);
  const gx = Math.round(g.x), gy = Math.round(g.y);
  const idx = instruments.findIndex(i => i.gx === gx && i.gy === gy);
  if (idx >= 0) instruments.splice(idx, 1);
});
document.getElementById('clearBtn').onclick = () => {
  instruments.length = 0;
  waves.length = 0;
};

// ========== 整秒发射 ==========
let secAccum = 0;
function emitWaves() {
  for (const instr of instruments) {
    waves.push({
      sx: instr.gx, sy: instr.gy,
      r: 0,
      freq: instr.freq,
      color: freqToColor(instr.freq),
      dead: false,
    });
  }
}

// ========== 主循环 ==========
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt) {
  // while 防止后台积压
  secAccum += dt;
  while (secAccum >= 1) {
    secAccum -= 1;
    emitWaves();
  }

  const VEL = 1; // 格/秒
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.r += VEL * dt;
    if (w.r >= FOUR_A) w.dead = true; // 经过2次完整反弹后消亡
    if (w.dead) waves.splice(i, 1);
  }
}

// ========== 渲染 ==========
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 舞台背景
  const ox = g2px(0, 0);
  ctx.fillStyle = '#0a0a18';
  ctx.fillRect(ox.x, ox.y, CW * GRID, CH * GRID);

  // 网格
  ctx.strokeStyle = 'rgba(100,100,160,0.18)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= CW; gx++) {
    const p1 = g2px(gx, 0), p2 = g2px(gx, CH);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  for (let gy = 0; gy <= CH; gy++) {
    const p1 = g2px(0, gy), p2 = g2px(CW, gy);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }

  // 椭圆剧场（半透明填充 + 描边）
  const ec = g2px(CX, CY);
  ctx.beginPath();
  ctx.ellipse(ec.x, ec.y, A * GRID, B * GRID, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(74, 111, 165, 0.15)';
  ctx.fill();
  ctx.strokeStyle = '#4a6fa5';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 舞台边界线
  const bx = g2px(BOUNDARY_X, 0).x;
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(bx, g2px(BOUNDARY_X, 0).y);
  ctx.lineTo(bx, g2px(BOUNDARY_X, CH).y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 焦点（红色十字 + 数字标注）
  for (const [fp, label] of [[F1, 'F1'], [F2, 'F2']]) {
    const p = g2px(fp.x, fp.y);
    // 十字准星
    ctx.strokeStyle = '#ff4757';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x - 8, p.y); ctx.lineTo(p.x + 8, p.y);
    ctx.moveTo(p.x, p.y - 8); ctx.lineTo(p.x, p.y + 8);
    ctx.stroke();
    // 圆点
    ctx.fillStyle = '#ff4757';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    // 标注
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(label, p.x + 8, p.y - 10);
    ctx.font = '10px monospace';
    ctx.fillText(`(${fp.x},${fp.y})`, p.x + 8, p.y + 18);
  }

  // 乐器
  for (const instr of instruments) {
    const p = g2px(instr.gx + 0.5, instr.gy + 0.5);
    // 阴影圆（表示"在整数格点"）
    ctx.beginPath();
    ctx.arc(p.x, p.y, GRID * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = freqToColor(instr.freq);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 图标
    ctx.font = `${GRID * 0.55}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(instr.type === 'triangle' ? '🔺' : '🪵', p.x, p.y);
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  }

  // 音波 —— 核心：双圆交替模型
  drawWaves();

  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

// ========== 音波绘制（椭圆完美反射模型）==========
/**
 * 数学基础：椭圆上任意点 P 满足 |F1P| + |PF2| = 2a = 10
 * 反射性质：从 F1 发出的任意射线撞边界后反射方向必过 F2。
 *
 * 波的旅程：从源点出发，4a=20 格 → 自动完成 2 次反弹后消亡。
 *
 * 关键渲染逻辑：
 *  对每个"从扩张圆心发出的角度"，判断扩张圈当前半径是否已撞到椭圆边界：
 *    - 没撞 → 画扩张圈这一段（在椭圆内）
 *    - 已撞 → 求边界交点 → 反射方向朝向收缩圆心 → 算当前波前在收缩圈上的角度
 *  最后：
 *    - 扩张圈只画"还没撞边界"的角度段（被边界截断的断环）
 *    - 收缩圈只画"已经撞了边界、波前已经汇聚到此处"的角度段
 *
 * 这会自然呈现出：扩张圈不断被边界截断 → 收缩圈从无到有从散到聚 →
 * 在 r=10 时收缩圈恰好收至焦点一点 → 随后进入 Phase 1 反向。
 */
function drawWaves() {
  const SAMPLES = 120;
  for (const w of waves) {
    if (w.dead) continue;

    const r = w.r;
    const phase = Math.floor(r / TWO_A);       // 0, 1
    const within = r - phase * TWO_A;           // 当前段内 0→10

    // 源点 & 对焦点（始终 F1↔F2 交替）
    const srcCenter = { x: w.sx + 0.5, y: w.sy + 0.5 };
    // 对焦点：在 F1 → F2；否则 → F1（包括 F2 和非焦点）
    const partner = (w.sx === F1.x && w.sy === F1.y) ? F2 : F1;
    const partnerCenter = { x: partner.x + 0.5, y: partner.y + 0.5 };

    let expandCenter, contractCenter;
    if (phase === 0) {
      expandCenter = srcCenter;
      contractCenter = partnerCenter;
    } else {
      expandCenter = partnerCenter;
      contractCenter = srcCenter;
    }

    const expandR = within;
    const contractR = TWO_A - within;
    const amp = Math.max(0.05, 1 - r / FOUR_A);

    ctx.strokeStyle = w.color;
    ctx.globalAlpha = amp;
    ctx.lineWidth = 1.5 + amp * 3;

    // ===== 统一模型：采样每个角度 → 画扩张圈椭圆内部分 + 收缩圈椭圆内且被反射命中 =====
    const expandSegments = [];
    const contractHitAngles = [];
    let expandSegStart = -1;

    for (let s = 0; s < SAMPLES; s++) {
      const theta = (s / SAMPLES) * Math.PI * 2;
      const dx = Math.cos(theta), dy = Math.sin(theta);
      // 扩张圈上这个角度、当前半径的点是否在椭圆内？
      const ex = expandCenter.x + dx * expandR;
      const ey = expandCenter.y + dy * expandR;
      const inside = insideEllipse(ex, ey);

      if (inside) {
        // 椭圆内 → 扩张圈保留
        if (expandSegStart < 0) expandSegStart = s;
      } else {
        // 椭圆外 → 扩张圈在此处断开；同时用射线求交点，算反射到达收缩圈的角度
        if (expandSegStart >= 0) {
          expandSegments.push({ start: expandSegStart, end: s });
          expandSegStart = -1;
        }
        // 用 rayEllipseT 精确求从扩张圆心沿此方向到椭圆边界的距离
        const d_hit = rayEllipseT(expandCenter.x, expandCenter.y, dx, dy);
        if (d_hit !== null && d_hit <= expandR + 0.01) {
          const Bx = expandCenter.x + d_hit * dx;
          const By = expandCenter.y + d_hit * dy;
          const remain = expandR - d_hit;
          const txf = contractCenter.x - Bx, tyf = contractCenter.y - By;
          const tlen = Math.hypot(txf, tyf) || 1e-6;
          const go = Math.min(remain, tlen);
          const px = Bx + (txf / tlen) * go;
          const py = By + (tyf / tlen) * go;
          const phi = Math.atan2(py - contractCenter.y, px - contractCenter.x);
          let phiNorm = ((phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          contractHitAngles.push(phiNorm);
        }
      }
    }
    if (expandSegStart >= 0) expandSegments.push({ start: expandSegStart, end: SAMPLES });

    // 画扩张圈（椭圆内的弧段）
    const ePx = g2px(expandCenter.x, expandCenter.y);
    const eRPx = expandR * GRID;
    for (const seg of expandSegments) {
      if (seg.end - seg.start < 1) continue;
      const a1 = (seg.start / SAMPLES) * Math.PI * 2;
      const a2 = (seg.end   / SAMPLES) * Math.PI * 2;
      drawArc(ePx.x, ePx.y, eRPx, a1, a2);
    }

    // 画收缩圈（只画反射波已到达 AND 在椭圆内的弧段）
    if (contractR > 0.05 && contractHitAngles.length > 0) {
      contractHitAngles.sort((a, b) => a - b);
      const bins = new Array(SAMPLES).fill(false);
      for (const ang of contractHitAngles) {
        const idx = Math.round(ang / (2 * Math.PI) * SAMPLES) % SAMPLES;
        bins[idx] = true;
        bins[(idx - 1 + SAMPLES) % SAMPLES] = true;
        bins[(idx + 1) % SAMPLES] = true;
      }
      // 额外过滤：收缩圈上这个角度对应的点必须也在椭圆内
      for (let i = 0; i < SAMPLES; i++) {
        if (!bins[i]) continue;
        const ang = (i / SAMPLES) * Math.PI * 2;
        const px = contractCenter.x + Math.cos(ang) * contractR;
        const py = contractCenter.y + Math.sin(ang) * contractR;
        if (!insideEllipse(px, py)) bins[i] = false;
      }
      const cPx = g2px(contractCenter.x, contractCenter.y);
      const cRPx = contractR * GRID;
      let binStart = -1;
      for (let i = 0; i <= SAMPLES; i++) {
        const valid = i < SAMPLES && bins[i];
        if (valid && binStart < 0) binStart = i;
        if (!valid && binStart >= 0) {
          const a1 = (binStart / SAMPLES) * Math.PI * 2;
          const a2 = (i / SAMPLES) * Math.PI * 2;
          drawArc(cPx.x, cPx.y, cRPx, a1, a2);
          binStart = -1;
        }
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

// 画圆弧段（数学角度 a1→a2，屏幕 Y 翻转）
function drawArc(px, py, rPx, a1, a2) {
  if (a2 - a1 < 1e-4) return;
  ctx.beginPath();
  // a1 < a2（逆时针短弧）→ -a1 > -a2（屏幕角度）
  // 从较大角度到较小角度，逆时针(true)走 = 短弧
  ctx.arc(px, py, rPx, -a1, -a2, true);
  ctx.stroke();
}


</script>
</body>
</html>
